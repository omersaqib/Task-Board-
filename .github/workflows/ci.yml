name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# One run per ref; a newer push supersedes the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  quality:
    name: Lint, types, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_PORT: '3001'
      WEB_PORT: '4173'
      PW_SKIP_WEBSERVER: '1'
      E2E_API_URL: http://localhost:3001
      E2E_BASE_URL: http://localhost:4173
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve Playwright version
        id: pw
        working-directory: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start backend and frontend
        env:
          NODE_ENV: production
          DATABASE_PATH: ${{ runner.temp }}/taskboard-e2e/taskboard.db
        run: |
          # Throwaway secret for this run only; masked in logs.
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"
          export JWT_SECRET
          scripts/start-services.sh

      - name: Wait for services to be healthy
        run: |
          scripts/wait-for-services.sh --timeout 120 \
            --pid-file logs/backend.pid --pid-file logs/frontend.pid \
            --log-file logs/backend.log --log-file logs/frontend.log \
            "$E2E_API_URL/api/health" "$E2E_BASE_URL/"

      - name: Verify every spec file is discovered
        run: npm run verify:discovery -w playwright

      - name: Run Playwright tests
        run: npm run test -w playwright

      - name: Verify results (no failures, no skips, tests executed)
        if: always()
        run: npm run verify:results -w playwright

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results (traces, screenshots, results.json)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: playwright/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs
          if-no-files-found: warn
          retention-days: 14

      - name: Stop services
        if: always()
        run: scripts/stop-services.sh

  # Builds (does not push) both production images so a broken Dockerfile is
  # caught on the PR instead of at deploy time. Runs in parallel with e2e.
  docker:
    name: Docker images build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t taskboard-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t taskboard-frontend:ci .

  # The single required status check. `if: always()` so it still runs (and
  # fails) when an upstream job failed, was skipped or was cancelled; a
  # skipped required check would otherwise count as passing for merging.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [quality, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to have succeeded
        env:
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "quality=$QUALITY e2e=$E2E docker=$DOCKER"
          for result in "$QUALITY" "$E2E" "$DOCKER"; do
            if [ "$result" != "success" ]; then
              echo "::error title=CI Gate::Blocked - an upstream job result was '$result' (must be 'success')."
              exit 1
            fi
          done
          echo "All required jobs succeeded."

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers / wait timer / branch restrictions are configured on
    # this GitHub Environment (Settings > Environments > production); the job
    # pauses until they approve.
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # ---- PLACEHOLDER: replace with the real build/publish/deploy ----
      - name: Build images (placeholder)
        run: |
          docker build -f backend/Dockerfile -t "taskboard-backend:${GITHUB_SHA}" .
          docker build -f frontend/Dockerfile -t "taskboard-frontend:${GITHUB_SHA}" .

      - name: Deploy (placeholder)
        run: |
          echo "PLACEHOLDER: push images to your registry and roll out to your platform here."
          echo "Use environment-scoped secrets (secrets.*) or OIDC; never hard-code credentials."
          echo "Deploying commit ${GITHUB_SHA} to production."
